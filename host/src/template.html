<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Nothing leaves the page: no fetch, no images or fonts from elsewhere. WebAssembly is compiled from bytes in the page (SQLite), its worker started from a blob: URL. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; worker-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>db-manager</title>
<link rel="icon" href="__ICON__">
<style>html, body { margin: 0; height: 100%; } #app { height: 100%; }</style>
</head>
<body>
<div id="app"></div>
<script>/*__SCRIPT__*/</script>
</body>
</html>
