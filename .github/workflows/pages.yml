name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push does not cancel one already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # tsc -b, the unit tests and the arch test.
      - run: npm test
      # build/db-manager.html and build/pages/; build.mjs fails on an external reference.
      - run: npm run build
      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where tools/chrome.mjs looks.
      # tests/pwa.mjs opens build/pages/: the service worker, the manifest, the page offline, an update.
      - run: npm run test:browser

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
